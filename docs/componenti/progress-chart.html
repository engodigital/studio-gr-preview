<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Chart — Studio GR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0A0A0A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .chart-card {
    background: #181818;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 700px;
  }

  .chart-title {
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 36px;
  }

  .bar-row {
    margin-bottom: 28px;
  }

  .bar-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .bar-label {
    color: #D0D0D0;
    font-size: 15px;
    font-weight: 400;
  }

  .bar-value {
    color: #FBC21D;
    font-size: 16px;
    font-weight: 700;
  }

  .bar-track {
    background: #2E2E2E;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: #FBC21D;
    border-radius: 4px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* Ritardo progressivo per ogni barra */
  .bar-row:nth-child(2) .bar-fill  { transition-delay: 0.05s; }
  .bar-row:nth-child(3) .bar-fill  { transition-delay: 0.10s; }
  .bar-row:nth-child(4) .bar-fill  { transition-delay: 0.15s; }
  .bar-row:nth-child(5) .bar-fill  { transition-delay: 0.20s; }
  .bar-row:nth-child(6) .bar-fill  { transition-delay: 0.25s; }
  .bar-row:nth-child(7) .bar-fill  { transition-delay: 0.30s; }
  .bar-row:nth-child(8) .bar-fill  { transition-delay: 0.35s; }
  .bar-row:nth-child(9) .bar-fill  { transition-delay: 0.40s; }

  .divider {
    border: none;
    border-top: 1px solid #2E2E2E;
    margin: 32px 0 24px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-label {
    color: #888;
    font-size: 15px;
  }

  .total-value {
    color: #FBC21D;
    font-size: 28px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.6s ease 1s;
  }

  /* Stato animato (attivato da JS) */
  .chart-card.animated .bar-fill {
    width: var(--target-width);
  }

  .chart-card.animated .total-value {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="chart-card" id="chart">
  <div class="chart-title">Ingredienti della Produttività — Esempio Report</div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Motivazione</span>
      <span class="bar-value">87%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 87%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Comunicazione</span>
      <span class="bar-value">74%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 74%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Orientamento al risultato</span>
      <span class="bar-value">92%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 92%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Leadership</span>
      <span class="bar-value">68%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 68%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Gestione dello stress</span>
      <span class="bar-value">81%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 81%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Problem solving</span>
      <span class="bar-value">79%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 79%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Collaborazione</span>
      <span class="bar-value">88%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 88%"></div></div>
  </div>

  <div class="bar-row">
    <div class="bar-header">
      <span class="bar-label">Autonomia</span>
      <span class="bar-value">65%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="--target-width: 65%"></div></div>
  </div>

  <hr class="divider">

  <div class="total-row">
    <span class="total-label">Punteggio complessivo</span>
    <span class="total-value">79%</span>
  </div>
</div>

<script>
  const card = document.getElementById('chart');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        card.classList.add('animated');
        observer.disconnect();
      }
    });
  }, { threshold: 0.2 });

  observer.observe(card);
</script>

</body>
</html>
