<svg xmlns="http://www.w3.org/2000/svg" width="220" height="72" viewBox="0 0 220 72">
  <rect width="220" height="72" fill="#1C1C1E"/>

  <!-- LinkedIn button -->
  <rect x="8" y="6" width="60" height="60" rx="14" fill="#3A3A3C"/>
  <!-- "in" lettermark -->
  <circle cx="25" cy="24" r="2.5" fill="#8E8E93"/>
  <rect x="23" y="29" width="4" height="13" rx="1" fill="#8E8E93"/>
  <rect x="31" y="29" width="4" height="13" rx="1" fill="#8E8E93"/>
  <path d="M35 33 C35 31 36 29 39 29 C42 29 43 31 43 33 L43 42 L39 42 L39 33.5 C39 32.5 38.5 32 37.5 32 C36.5 32 35 32.5 35 34 Z" fill="#8E8E93"/>

  <!-- YouTube button -->
  <rect x="80" y="6" width="60" height="60" rx="14" fill="#3A3A3C"/>
  <!-- YouTube icon: rounded rect + play triangle -->
  <rect x="93" y="27" width="34" height="22" rx="6" fill="none" stroke="#8E8E93" stroke-width="2"/>
  <polygon points="107,31 107,45 121,38" fill="#8E8E93"/>

  <!-- Calendar button -->
  <rect x="152" y="6" width="60" height="60" rx="14" fill="#3A3A3C"/>
  <!-- Calendar icon body -->
  <rect x="165" y="27" width="26" height="22" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/>
  <!-- Top rail line -->
  <line x1="165" y1="33" x2="191" y2="33" stroke="#8E8E93" stroke-width="2"/>
  <!-- Tab handles -->
  <rect x="169" y="23" width="4" height="7" rx="2" fill="#8E8E93"/>
  <rect x="183" y="23" width="4" height="7" rx="2" fill="#8E8E93"/>
  <!-- Dots grid -->
  <circle cx="171" cy="38" r="1.2" fill="#8E8E93"/>
  <circle cx="178" cy="38" r="1.2" fill="#8E8E93"/>
  <circle cx="185" cy="38" r="1.2" fill="#8E8E93"/>
  <circle cx="171" cy="44" r="1.2" fill="#8E8E93"/>
  <circle cx="178" cy="44" r="1.2" fill="#8E8E93"/>
</svg>
