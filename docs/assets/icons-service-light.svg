<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120">
  <rect width="360" height="120" fill="#FFFFFF"/>

  <!-- Vertical dividers -->
  <line x1="120" y1="0" x2="120" y2="120" stroke="#EBEBEB" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="120" stroke="#EBEBEB" stroke-width="1"/>

  <!-- === BULLSEYE / TARGET (left) === -->
  <rect x="20" y="20" width="80" height="80" rx="18" fill="#FFF8E6"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="22" fill="none" stroke="#F5B731" stroke-width="3"/>
  <!-- Middle ring -->
  <circle cx="60" cy="60" r="13" fill="none" stroke="#F5B731" stroke-width="3"/>
  <!-- Inner dot -->
  <circle cx="60" cy="60" r="5" fill="#F5B731"/>

  <!-- === HANDSHAKE (center) === -->
  <rect x="140" y="20" width="80" height="80" rx="18" fill="#FFF8E6"/>
  <!-- Handshake icon -->
  <g transform="translate(157,45)" fill="#F5B731">
    <!-- Left hand -->
    <path d="M0 16 L0 10 C0 8 1 7 3 7 L10 7 L14 3 C15 2 17 2 18 3 L22 7 L26 7 C28 7 29 8 29 10 L29 16 C29 17 28 18 26 18 L20 18 L15 22 C14 23 12 23 11 22 L6 18 L3 18 C1 18 0 17 0 16 Z"/>
    <!-- Clasped fingers hint -->
    <rect x="10" y="6" width="2" height="4" rx="1"/>
    <rect x="14" y="4" width="2" height="5" rx="1"/>
    <rect x="18" y="4" width="2" height="5" rx="1"/>
    <rect x="22" y="6" width="2" height="4" rx="1"/>
  </g>

  <!-- === FLASK / BEAKER (right) === -->
  <rect x="260" y="20" width="80" height="80" rx="18" fill="#FFF8E6"/>
  <!-- Erlenmeyer flask -->
  <path d="M292 35 L292 58 L278 80 C277 82 278 84 280 84 L320 84 C322 84 323 82 322 80 L308 58 L308 35 Z"
        fill="#F5B731"/>
  <!-- Neck outline (darker shade to show shape) -->
  <rect x="292" y="35" width="16" height="5" rx="2" fill="#E8A000"/>
  <!-- Flask neck top rim -->
  <rect x="289" y="33" width="22" height="5" rx="3" fill="#F5B731"/>
  <!-- Liquid level (slightly darker) -->
  <path d="M283 72 L317 72 L322 80 C323 82 322 84 320 84 L280 84 C278 84 277 82 278 80 Z"
        fill="#E8A000" opacity="0.6"/>
</svg>
