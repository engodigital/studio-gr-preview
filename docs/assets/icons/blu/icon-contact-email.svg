<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02519e"/>
      <stop offset="100%" stop-color="#02519e"/>
    </linearGradient>
    <linearGradient id="icon" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>
  <!-- Busta email -->
  <!-- Corpo busta -->
  <rect x="30" y="62" width="140" height="96" rx="10" ry="10" fill="url(#icon)"/>
  <!-- Piega superiore V -->
  <path d="M 30,62 L 100,118 L 170,62 Z" fill="url(#icon)"/>
  <!-- Triangolo scuro sopra per creare il V aperto -->
  <path d="M 38,68 L 100,112 L 162,68 Z" fill="#1C1400"/>
