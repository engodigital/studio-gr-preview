  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Bolla 2 retro (oro scuro, basso-sinistra) -->
  <rect x="22" y="72" width="116" height="76" rx="14" fill="#FFFFFF"/>
  <polygon points="38,148 26,166 64,148" fill="#FFFFFF"/>
  <!-- Bolla 1 fronte (gradiente giallo, alto-destra) -->
